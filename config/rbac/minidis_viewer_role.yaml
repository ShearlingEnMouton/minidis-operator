# This rule is not used by the project minidis-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to minidis.shearlingenmouton.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: minidis-operator
    app.kubernetes.io/managed-by: kustomize
  name: minidis-viewer-role
rules:
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis/status
  verbs:
  - get
