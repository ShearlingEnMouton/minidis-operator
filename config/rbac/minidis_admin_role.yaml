# This rule is not used by the project minidis-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over minidis.shearlingenmouton.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: minidis-operator
    app.kubernetes.io/managed-by: kustomize
  name: minidis-admin-role
rules:
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis
  verbs:
  - '*'
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis/status
  verbs:
  - get
