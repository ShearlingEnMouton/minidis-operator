---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis/finalizers
  verbs:
  - update
- apiGroups:
  - minidis.shearlingenmouton.github.io
  resources:
  - minidis/status
  verbs:
  - get
  - patch
  - update
